name: CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to redeploy (e.g. gha-123456789-1). Leave empty to build new images.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validate-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.merged-pr.outputs.deploy || steps.manual.outputs.deploy || 'false' }}
    steps:
      - name: Require a merged pull request for automatic deployment
        id: merged-pr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            | jq --arg sha "$SHA" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length')
          if [ "$merged" -gt 0 ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$SHA was pushed to main without a merged pull request, so it is not deployed automatically."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require main for manual deployment
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Manual deployment must be run from main."
            exit 1
          fi
          if [ -n "$IMAGE_TAG" ] && ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::image_tag contains characters that are not valid in an OCI image tag."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      images: ${{ steps.detect.outputs.images }}
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed parts
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          everything() {
            { echo "frontend=true"; echo "backend=true"; echo "images=Api,Web"; echo "deploy=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Manual runs build and deploy everything.
          [ "$EVENT" = "workflow_dispatch" ] && everything

          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA")
          else
            # Compare against the last commit that deployed successfully, so changes from a
            # failed deploy are still built next time. A manual image_tag redeploy skips the
            # frontend job and does not count, because it may run an older image.
            for run in $(gh api "repos/$REPO/actions/workflows/ci-cd.yml/runs?branch=main&status=completed&per_page=30" \
                --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | "\(.id):\(.event):\(.head_sha)"'); do
              IFS=: read -r id event sha <<< "$run"
              jobs=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[] | {(.name): .conclusion}] | add // {}') || continue
              deployed=$(jq -r --arg event "$event" \
                '.deploy == "success" and ($event != "workflow_dispatch" or .frontend != "skipped")' <<< "$jobs")
              if [ "$deployed" = "true" ] && git merge-base --is-ancestor "$sha" "$HEAD_SHA" 2>/dev/null; then
                base="$sha"
                break
              fi
            done
          fi
          if [ -z "$base" ]; then
            echo "::notice::No base commit to compare with, so everything is built."
            everything
          fi

          files=$(git diff --name-only "$base" "$HEAD_SHA")
          echo "Changed since $base:"
          echo "${files:-(nothing)}"
          has() { grep -qE "$1" <<< "$files"; }

          frontend=false; backend=false; web=false; api=false; infra=false
          if has '^(src/|Data/|package(-lock)?\.json$|angular\.json$|tsconfig[^/]*\.json$|\.nvmrc$)'; then frontend=true; web=true; fi
          if has '^server/Web/'; then backend=true; web=true; fi
          if has '^server/Api/'; then backend=true; api=true; fi
          if has '^server/'; then backend=true; fi
          if has '^\.dockerignore$'; then web=true; api=true; fi
          if has '^\.github/workflows/ci-cd\.yml$'; then frontend=true; backend=true; infra=true; fi
          if grep -E '^deployment/' <<< "$files" | grep -qvE '^deployment/(tests/|.*\.md$)'; then infra=true; fi

          images=$( { [ "$api" = true ] && echo Api; [ "$web" = true ] && echo Web; } | paste -sd, - || true)
          deploy=false
          if [ "$web" = true ] || [ "$api" = true ] || [ "$infra" = true ]; then deploy=true; fi
          { echo "frontend=$frontend"; echo "backend=$backend"; echo "images=$images"; echo "deploy=$deploy"; } >> "$GITHUB_OUTPUT"
          echo "frontend tests=$frontend, backend tests=$backend, images to build=${images:-none}, deploy=$deploy"

  frontend:
    if: inputs.image_tag == '' && needs.changes.outputs.frontend == 'true'
    needs: [validate-ref, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend:
    if: inputs.image_tag == '' && needs.changes.outputs.backend == 'true'
    needs: [validate-ref, changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test server/Tests/Tests.csproj --configuration Release

  deploy:
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.validate-ref.result == 'success' &&
      needs.validate-ref.outputs.deploy == 'true' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    needs: [validate-ref, changes, frontend, backend]
    runs-on: windows-latest
    environment: development
    concurrency:
      group: azure-development-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            $parsed = [guid]::Empty
            if (-not [guid]::TryParse([Environment]::GetEnvironmentVariable($name), [ref]$parsed) -or $parsed -eq [guid]::Empty) {
              throw "$name must be configured as a non-empty GUID in the development environment variables."
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:ALLOWED_USER_IDS)) {
            throw 'Configure ALLOWED_USER_IDS as a comma-separated list of approved Entra user object IDs in the development environment secrets.'
          }
          foreach ($value in $env:ALLOWED_USER_IDS.Split(',')) {
            $parsed = [guid]::Empty
            if (-not [guid]::TryParse($value.Trim(), [ref]$parsed) -or $parsed -eq [guid]::Empty) {
              throw 'ALLOWED_USER_IDS must contain only non-empty GUIDs separated by commas.'
            }
          }
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and deploy with existing scripts
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          IMPORT_DEPLOYMENT_NAME: ${{ vars.IMPORT_DEPLOYMENT_NAME }}
          EXISTING_IMAGE_TAG: ${{ inputs.image_tag }}
          BUILD_IMAGES: ${{ needs.changes.outputs.images }}
        run: |
          $ErrorActionPreference = 'Stop'
          $allowedUsers = @($env:ALLOWED_USER_IDS.Split(',') | ForEach-Object { [guid]$_.Trim() })
          $buildImages = @("$env:BUILD_IMAGES".Split(',', [StringSplitOptions]::RemoveEmptyEntries))
          $skipBuild = -not [string]::IsNullOrWhiteSpace($env:EXISTING_IMAGE_TAG)
          if ($skipBuild) {
            $imageTag = $env:EXISTING_IMAGE_TAG.Trim()
            if ($imageTag -notmatch '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$') {
              throw 'image_tag contains characters that are not valid in an OCI image tag.'
            }
          }
          else {
            $imageTag = "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          & .\deployment\deploy.ps1 `
            -SubscriptionId ([guid]$env:AZURE_SUBSCRIPTION_ID) `
            -TenantId ([guid]$env:AZURE_TENANT_ID) `
            -AllowedUserIds $allowedUsers `
            -ImageTag $imageTag `
            -SkipBuild:$skipBuild `
            -Images $buildImages `
            -EnableImports:([bool](-not [string]::IsNullOrWhiteSpace($env:IMPORT_DEPLOYMENT_NAME))) `
            -ImportDeploymentName $env:IMPORT_DEPLOYMENT_NAME -Deploy -Confirm:$false
      - name: Check public web health
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fqdn = az containerapp show --name examinator-web --resource-group examinator `
            --subscription $env:AZURE_SUBSCRIPTION_ID --query properties.configuration.ingress.fqdn `
            --output tsv --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($fqdn)) {
            throw 'Could not resolve the deployed web app hostname.'
          }
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri "https://$fqdn/healthz" -TimeoutSec 20 -MaximumRedirection 0
              if ($response.StatusCode -eq 200) {
                Write-Host 'Web health endpoint returned HTTP 200.'
                exit 0
              }
              Write-Warning "Web health check returned HTTP $($response.StatusCode)."
            }
            catch {
              Write-Warning "Web health check attempt $attempt failed: $($_.Exception.Message)"
            }
            if ($attempt -lt 12) { Start-Sleep -Seconds 10 }
          }
          throw 'Web health endpoint did not return HTTP 200 after deployment.'
